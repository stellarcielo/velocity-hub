name: Build and Release

on: workflow_dispatch

jobs:
  buildAndRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # The wrapper jar is not committed, so install the same Gradle version as gradle-wrapper.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build with Gradle
        run: gradle shadowJar

      - name: Read version
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: List build directory
        run: ls -R build/libs

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velocity-hub-jar
          path: build/libs/velocity-hub-${{ steps.version.outputs.version }}-all.jar

      # Upload the shadow jar (includes bStats) under the usual file name
      - name: Prepare release asset
        run: cp build/libs/velocity-hub-${{ steps.version.outputs.version }}-all.jar velocity-hub-${{ steps.version.outputs.version }}.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: velocity-hub-${{ steps.version.outputs.version }}.jar
